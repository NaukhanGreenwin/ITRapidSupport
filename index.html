    <!-- Fonts — self-hosted Inter. The Google Fonts stylesheet used to sit here,
         and preconnect could not save it: the <link rel=stylesheet> still blocked
         first paint on a third-party round trip before the woff2 was even known.
         Serving the font from our own origin removes that hop entirely, and the
         @font-face rules are inline so there is no second CSS request either.
         One variable file covers weights 300-700 (tailwind.config.js sans stack). -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url('/fonts/inter-latin-var.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

        font-weight: 300 700;

      }
    </style>
    
    <!-- Google Analytics (GA4) + Google Ads tags — single loader; AnalyticsTracker sends
         page_view events on route change, so auto page_view stays off here
         to avoid double-counting the first pageview. The loader is skipped
         entirely for automated browsers (navigator.webdriver) so the prerender
         pass doesn't inflate GA4 with a hit per route on every deploy. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      if (!navigator.webdriver) {
        // gtag.js is ~148KB and competes with the critical render path for
        // bandwidth and main-thread time. Nothing above the fold needs it, so
        // defer the loader until after load (or first interaction, whichever
        // comes first). gtag() calls made before then still queue on dataLayer
        // and replay once the script arrives, so no hits are lost.
        var gaLoaded = false;
        var loadGA = function () {
          if (gaLoaded) return;
          gaLoaded = true;
          var gaScript = document.createElement('script');
          gaScript.async = true;
          gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-KNT7SJ3LYP';
          document.head.appendChild(gaScript);
        };
        gtag('js', new Date());
        gtag('config', 'G-KNT7SJ3LYP', {
          send_page_view: false,
          cookie_flags: 'samesite=none;secure',
          anonymize_ip: true
        });
        // Google Ads tag (account 602-431-1245). One gtag.js loader serves both
        // destinations, so this needs no second script tag.
        gtag('config', 'AW-18376615029');
        ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (evt) {
          window.addEventListener(evt, loadGA, { once: true, passive: true });
        });
        if (document.readyState === 'complete') {
          setTimeout(loadGA, 1500);
        } else {
          window.addEventListener('load', function () { setTimeout(loadGA, 1500); }, { once: true });
        }
      }
    </script>

    <script type="text/javascript">
      // This script checks if a redirect is coming from the 404.html page
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
